<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growth Hacking Talk — Deck</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b101b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    #deck-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b101b; }
    .slide-view { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; }
    .slide-view img { max-width: 100%; max-height: 100%; aspect-ratio: 16/9; object-fit: contain; border-radius: 6px; box-shadow: 0 12px 48px rgba(0,0,0,0.6); user-select: none; pointer-events: none; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; opacity: 0; z-index: 10; }
    #deck-container:hover .nav-btn { opacity: 0.85; }
    .nav-btn:hover { opacity: 1 !important; background: rgba(255,255,255,0.32); transform: translateY(-50%) scale(1.08); }
    .nav-btn.prev { left: 24px; }
    .nav-btn.next { right: 24px; }
    .nav-btn:disabled { opacity: 0 !important; pointer-events: none; }
    .pager-pill { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(11,16,27,0.75); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 999px; font-size: 0.84rem; font-weight: 600; color: #e2e8f0; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 10; }
    #deck-container:hover .pager-pill { opacity: 1; }
    .click-target { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 5; cursor: pointer; }
    .click-target.left { left: 0; }
    .click-target.right { right: 0; }
  </style>
</head>
<body>
  <div id="deck-container">
    <div class="click-target left" id="targetLeft" title="Previous Slide"></div>
    <div class="click-target right" id="targetRight" title="Next Slide"></div>

    <div class="slide-view">
      <img id="slideImg" src="../thumbs/growth-hacking/01.jpg" alt="Slide 1" />
    </div>

    <button class="nav-btn prev" id="prevBtn" type="button" aria-label="Previous Slide"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="nav-btn next" id="nextBtn" type="button" aria-label="Next Slide"><i class="fa-solid fa-chevron-right"></i></button>

    <div class="pager-pill" id="pager"><span id="curPage">1</span> / 36</div>
  </div>

  <script>
    (function() {
      var total = 36;
      var cur = 1;
      var img = document.getElementById('slideImg');
      var pager = document.getElementById('curPage');
      var prevBtn = document.getElementById('prevBtn');
      var nextBtn = document.getElementById('nextBtn');

      function pad(n) { return (n < 10 ? '0' : '') + n; }

      function update(n, updateHash) {
        cur = Math.max(1, Math.min(total, n));
        img.src = '../thumbs/growth-hacking/' + pad(cur) + '.jpg';
        img.alt = 'Slide ' + cur;
        pager.textContent = cur;
        prevBtn.disabled = cur <= 1;
        nextBtn.disabled = cur >= total;

        if (updateHash !== false) {
          try {
            history.replaceState(null, '', '#' + cur);
          } catch(e) {
            location.hash = '#' + cur;
          }
        }
      }

      function next() { if (cur < total) update(cur + 1); }
      function prev() { if (cur > 1) update(cur - 1); }

      prevBtn.addEventListener('click', prev);
      nextBtn.addEventListener('click', next);
      document.getElementById('targetLeft').addEventListener('click', prev);
      document.getElementById('targetRight').addEventListener('click', next);

      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          next();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prev();
        } else if (e.key === 'Home') {
          e.preventDefault();
          update(1);
        } else if (e.key === 'End') {
          e.preventDefault();
          update(total);
        }
      });

      // Swipe support
      var startX = 0;
      window.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) startX = e.touches[0].clientX;
      }, { passive: true });

      window.addEventListener('touchend', function(e) {
        if (e.changedTouches.length === 1) {
          var diff = e.changedTouches[0].clientX - startX;
          if (diff < -50) next();
          else if (diff > 50) prev();
        }
      }, { passive: true });

      function readHash() {
        var m = /^#(\d+)$/.exec(location.hash);
        return m ? parseInt(m[1], 10) : 1;
      }

      window.addEventListener('hashchange', function() {
        var h = readHash();
        if (h && h !== cur) update(h, false);
      });

      // Preload adjacent images
      function preloadNext(n) {
        if (n <= total) {
          var im = new Image();
          im.src = '../thumbs/growth-hacking/' + pad(n) + '.jpg';
        }
      }

      var init = readHash();
      update(init, false);
      preloadNext(cur + 1);
    })();
  </script>
</body>
</html>
