<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{localStorage.setItem("lmsStudentHomeTheme","light")}catch(e){}document.documentElement.dataset.theme="light";</script>
  <script id="auth-guard">
    (function() {
      function getCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for(var i=0; i < ca.length; i++) {
          var c = ca[i];
          while (c.charAt(0)==' ') c = c.substring(1,c.length);
          if (c.indexOf(nameEQ) == 0) return decodeURIComponent(c.substring(nameEQ.length,c.length));
        }
        return null;
      }
      
      var loggedInUser = getCookie('currentUser');
      
      if (!loggedInUser) {
        var sessionStr = localStorage.getItem('currentUserSession');
        if (sessionStr) {
          try {
            var session = JSON.parse(sessionStr);
            if (Date.now() < session.expiresAt) {
              loggedInUser = session.value;
            } else {
              localStorage.removeItem('currentUserSession');
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
      
      var isLoginPage = window.location.pathname.indexOf('login.html') !== -1;
      
      if (isLoginPage) {
        if (loggedInUser) {
          window.location.href = '../index.html';
        }
      } else {
        if (!loggedInUser) {
          var redirectPath = 'login/login.html';
          var m = window.location.pathname.match(/^(.*\/NA\/LMS2\/docs\/)/);
          if (m) {
            redirectPath = m[1] + 'login/login.html';
          } else {
            var idx = window.location.pathname.indexOf('LMS2/docs/');
            if (idx !== -1) {
              var sub = window.location.pathname.substring(idx + 'LMS2/docs/'.length);
              var depth = (sub.match(/\//g) || []).length;
              redirectPath = (depth > 0 ? '../'.repeat(depth) : '') + 'login/login.html';
            } else if (window.location.pathname.indexOf('/day') !== -1 || window.location.pathname.indexOf('/announcement') !== -1 || window.location.pathname.indexOf('/project_day') !== -1) {
              redirectPath = '../login/login.html';
            }
          }
          window.location.href = redirectPath;
        }
      }
    })();
  </script>
  <title>교육 자료 | ACE AI SW Startup Training</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./materials/materials.css?v=20261119" />
  <script src="./materials/catalog.js?v=20261119"></script>
  <script src="./shared/lms-header.js?v=20261119-materials"></script>
</head>
<body>
  <main class="shell">
    <header class="viewer-head">
      <div>
        <nav class="crumbs" aria-label="현재 위치"><a href="index.html">학습 홈</a><span class="sep">›</span><a href="materials.html">교육 자료</a><span class="sep">›</span><span id="crumbTitle"></span></nav>
        <p class="eyebrow" id="kicker"></p>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="actions">
        <a class="btn" href="materials.html"><i class="fa-solid fa-grip"></i><span>전체 자료</span></a>
        <button class="btn" id="shareBtn" type="button"><i class="fa-solid fa-link"></i><span>링크 복사</span></button>
        <a class="btn" id="downloadBtn" download><i class="fa-solid fa-download"></i><span>다운로드</span></a>
        <a class="btn primary" id="newTabBtn" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i><span>새 탭에서 크게 보기</span></a>
      </div>
    </header>

    <div class="viewer-grid">
      <section>
        <div class="player" id="player">
          <div class="stage">
            <iframe id="deckFrame" title="강의 슬라이드" allow="fullscreen" allowfullscreen></iframe>
            <div class="stage-loading" id="loading"><div><div class="spinner"></div>슬라이드를 불러오는 중…</div></div>
            <button class="stage-nav prev" id="stagePrev" type="button" aria-label="이전 슬라이드"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="stage-nav next" id="stageNext" type="button" aria-label="다음 슬라이드"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="controls">
            <button class="ctrl" id="firstBtn" type="button" title="처음으로 (Home)" aria-label="처음으로"><i class="fa-solid fa-backward-step"></i></button>
            <button class="ctrl" id="prevBtn" type="button" title="이전 슬라이드 (←)" aria-label="이전 슬라이드"><i class="fa-solid fa-chevron-left"></i></button>
            <label class="pageno"><input id="pageInput" inputmode="numeric" aria-label="슬라이드 이동" value="1" /> / <span id="pageTotal">0</span></label>
            <button class="ctrl" id="nextBtn" type="button" title="다음 슬라이드 (→)" aria-label="다음 슬라이드"><i class="fa-solid fa-chevron-right"></i></button>
            <input class="progress" id="progress" type="range" min="1" max="1" value="1" aria-label="슬라이드 이동" />
            <span class="kbd-hint">← → 이동 · F 전체화면</span>
            <span class="ctrl-sep"></span>
            <button class="ctrl" id="fsBtn" type="button" title="전체화면 (F)" aria-label="전체화면"><i class="fa-solid fa-expand"></i></button>
          </div>
        </div>

        <div class="slide-caption"><span class="num" id="capNum"></span><h2 id="capTitle"></h2></div>

        <details class="notes" id="notes" open>
          <summary><span><i class="fa-regular fa-note-sticky" style="color:var(--green-ng)"></i> 발표자 노트 <span class="hint">(영문 원문)</span></span><i class="fa-solid fa-chevron-down"></i></summary>
          <div class="notes-body" id="notesBody"></div>
        </details>

        <div class="about">
          <h3>자료 소개</h3>
          <p id="desc"></p>
          <div class="tags" id="tags"></div>
        </div>
      </section>

      <aside class="side" aria-label="슬라이드 목록">
        <div class="side-head">슬라이드 목록 <span id="sideCount"></span></div>
        <div class="thumbs" id="thumbs"></div>
      </aside>
    </div>

    <section class="more" id="more">
      <h2>다른 교육 자료</h2>
      <div class="deck-grid" id="moreGrid"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
  (function () {
    "use strict";
    var LANG = "ko";
    var T = {"decks": "자료 {n}개", "slides": "슬라이드 {n}장", "lang_note": "슬라이드 언어: 영어", "open": "슬라이드 보기", "empty": "검색 결과가 없습니다.", "count": "{n}개 자료", "slide_no": "슬라이드 {n} / {t}", "no_notes": "이 슬라이드에는 노트가 없습니다.", "copied": "링크를 복사했습니다.", "copy_prompt": "아래 링크를 복사하세요"};
    var decks = window.LMS_MATERIALS || [];
    var params = new URLSearchParams(location.search);
    var deck = decks.filter(function (d) { return d.id === params.get("deck"); })[0];
    if (!deck) { location.replace("materials.html"); return; }

    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function thumb(d, n) { return "materials/thumbs/" + d.id + "/" + pad(n) + ".jpg"; }

    var m = deck[LANG], N = deck.count, cur = 1, lockUntil = 0;
    var deckUrl = "materials/decks/" + deck.id + ".html";
    var frame = $("deckFrame");

    // ---------- static info ----------
    document.title = m.title + " · " + document.title;
    $("crumbTitle").textContent = m.title;
    $("kicker").textContent = m.kicker;
    $("title").textContent = m.title + (m.sub ? " — " + m.sub : "");
    $("meta").innerHTML =
      '<span class="chip ng"><i class="fa-regular fa-images"></i>' + esc(T.slides.replace("{n}", N)) + '</span>' +
      '<span class="chip"><i class="fa-solid fa-location-dot"></i>' + esc(deck.place + " · " + deck.date) + '</span>' +
      '<span class="chip"><i class="fa-solid fa-language"></i>' + esc(T.lang_note) + '</span>';
    $("desc").textContent = m.desc;
    $("tags").innerHTML = m.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("");
    $("pageTotal").textContent = N;
    $("sideCount").textContent = N;
    $("progress").max = N;
    if (deck.files && deck.files.length) {
      $("downloadBtn").href = deck.files[0].url;
      $("downloadBtn").setAttribute("download", deck.files[0].name);
      $("downloadBtn").innerHTML = '<i class="fa-solid fa-file-powerpoint"></i><span>PPTX 다운로드</span>';
      
      var pdfBtn = document.createElement("a");
      pdfBtn.className = "btn";
      pdfBtn.href = deck.files[1] ? deck.files[1].url : deck.files[0].url;
      pdfBtn.setAttribute("download", deck.files[1] ? deck.files[1].name : "");
      pdfBtn.target = "_blank";
      pdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i><span>PDF 보기/다운로드</span>';
      $("downloadBtn").parentNode.insertBefore(pdfBtn, $("downloadBtn").nextSibling);

      var filesHtml = '<div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;">' +
        deck.files.map(function (f) {
          var icon = f.ext === 'PPTX' ? 'fa-file-powerpoint' : (f.ext === 'PDF' ? 'fa-file-pdf' : 'fa-file');
          var bg = f.ext === 'PPTX' ? '#D14836' : (f.ext === 'PDF' ? '#C5221F' : 'var(--blue)');
          return '<a href="' + esc(f.url) + '" download="' + esc(f.name) + '" class="btn" style="background:' + bg + '; color:#fff; border:0; padding:0 14px; font-size:0.88rem; text-decoration:none;"><i class="fa-solid ' + icon + '"></i> ' + esc(f.name) + ' (' + esc(f.size) + ')</a>';
        }).join('') + '</div>';
      $("desc").insertAdjacentHTML("afterend", filesHtml);
    } else {
      $("downloadBtn").href = deckUrl;
      $("downloadBtn").setAttribute("download", deck.id + ".html");
    }

    $("thumbs").innerHTML = deck.slides.map(function (s, i) {
      return '<button class="thumb" type="button" data-n="' + (i + 1) + '" title="' + esc((i + 1) + ". " + s.t) + '">' +
        '<span class="n">' + (i + 1) + '</span><img src="' + thumb(deck, i + 1) + '" alt="" loading="lazy" /><span class="t">' + esc(s.t) + '</span></button>';
    }).join("");

    var others = decks.filter(function (d) { return d.id !== deck.id; });
    if (!others.length) $("more").hidden = true;
    $("moreGrid").innerHTML = others.map(function (d) {
      var o = d[LANG];
      return '<a class="deck-card" href="materials_viewer.html?deck=' + encodeURIComponent(d.id) + '">' +
        '<div class="deck-cover"><img src="materials/thumbs/' + d.id + '/cover.jpg" alt="" loading="lazy" />' +
        '<span class="cover-play"><span><i class="fa-solid fa-play"></i></span></span>' +
        '<span class="cover-badge"><i class="fa-regular fa-images"></i>' + esc(T.slides.replace("{n}", d.count)) + '</span></div>' +
        '<div class="deck-body"><span class="deck-kicker">' + esc(o.kicker) + '</span><h2 class="deck-title">' + esc(o.title) + '<small>' + esc(o.sub) + '</small></h2>' +
        '<p class="deck-desc">' + esc(o.desc) + '</p><div class="deck-foot"><span>' + esc(T.slides.replace("{n}", d.count)) + '</span><strong>' + esc(T.open) + ' →</strong></div></div></a>';
    }).join("");

    // ---------- deck bridge ----------
    // The deck HTML keeps its own player. It moves on keyboard events and on
    // "#N" hash changes, and writes the current slide back to its hash.
    function deckWin() {
      try { var w = frame.contentWindow; void w.location.href; return w; } catch (e) { return null; }
    }
    function readDeckIndex() {
      var w = deckWin(); if (!w) return null;
      var mm = /^#(\d+)$/.exec(w.location.hash);
      return mm ? Number(mm[1]) : null;
    }
    function sendKey(key) {
      var w = deckWin();
      if (!w) return false;
      try { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true })); return true; }
      catch (e) { return false; }
    }
    function goTo(n) {
      n = Math.max(1, Math.min(N, Math.round(n) || 1));
      if (n === cur) return;
      lockUntil = Date.now() + 700;
      var w = deckWin();
      if (n === cur + 1 && sendKey("ArrowRight")) { setCur(n); return; }
      if (n === cur - 1 && sendKey("ArrowLeft")) { setCur(n); return; }
      if (w) { try { w.location.replace(w.location.href.split("#")[0] + "#" + n); } catch (e) { frame.src = deckUrl + "#" + n; } }
      else { frame.src = deckUrl + "#" + n; }
      setCur(n);
    }

    // ---------- UI state ----------
    function setCur(n) {
      cur = n;
      $("pageInput").value = n;
      $("progress").value = n;
      $("prevBtn").disabled = $("firstBtn").disabled = $("stagePrev").disabled = n <= 1;
      $("nextBtn").disabled = $("stageNext").disabled = n >= N;
      var s = deck.slides[n - 1] || { t: "", n: "" };
      $("capNum").textContent = T.slide_no.replace("{n}", n).replace("{t}", N);
      $("capTitle").textContent = s.t;
      $("notesBody").textContent = s.n || T.no_notes;
      var list = $("thumbs"), active = list.querySelector(".thumb.active");
      if (active) active.classList.remove("active");
      var el = list.querySelector('.thumb[data-n="' + n + '"]');
      if (el) {
        el.classList.add("active");
        var lr = list.getBoundingClientRect(), er = el.getBoundingClientRect();
        if (er.top < lr.top || er.bottom > lr.bottom || er.left < lr.left || er.right > lr.right) {
          if (list.scrollHeight > list.clientHeight) list.scrollTop += (er.top - lr.top) - (lr.height - er.height) / 2;
          else list.scrollLeft += (er.left - lr.left) - (lr.width - er.width) / 2;
        }
      }
      $("newTabBtn").href = deckUrl + "#" + n;
      try { history.replaceState(null, "", location.pathname + location.search + "#" + n); } catch (e) {}
    }

    // poll the deck so clicks / swipes / keys inside the slides stay in sync
    setInterval(function () {
      var n = readDeckIndex();
      if (Date.now() < lockUntil) return;
      if (n && n !== cur) setCur(n);
    }, 250);

    // ---------- events ----------
    $("prevBtn").onclick = $("stagePrev").onclick = function () { goTo(cur - 1); };
    $("nextBtn").onclick = $("stageNext").onclick = function () { goTo(cur + 1); };
    $("firstBtn").onclick = function () { goTo(1); };
    $("progress").addEventListener("input", function () { goTo(Number(this.value)); });
    $("pageInput").addEventListener("change", function () { goTo(Number(this.value)); });
    $("pageInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { goTo(Number(this.value)); this.blur(); } });
    $("thumbs").addEventListener("click", function (e) {
      var b = e.target.closest(".thumb"); if (b) goTo(Number(b.dataset.n));
    });

    var player = $("player");
    function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
    function toggleFs() {
      if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      var req = player.requestFullscreen || player.webkitRequestFullscreen;
      if (req) req.call(player);
    }
    $("fsBtn").onclick = toggleFs;
    function fsIcon() { $("fsBtn").innerHTML = isFs() ? '<i class="fa-solid fa-compress"></i>' : '<i class="fa-solid fa-expand"></i>'; }
    document.addEventListener("fullscreenchange", fsIcon);
    document.addEventListener("webkitfullscreenchange", fsIcon);

    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goTo(cur + 1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(cur - 1); }
      else if (e.key === "Home") { e.preventDefault(); goTo(1); }
      else if (e.key === "End") { e.preventDefault(); goTo(N); }
      else if (e.key === "f" || e.key === "F") { toggleFs(); }
    });

    function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 1800); }
    $("shareBtn").onclick = function () {
      var url = location.href;
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(function () { toast(T.copied); }, function () { prompt(T.copy_prompt, url); });
      else { var ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(T.copied); } catch (e) { prompt(T.copy_prompt, url); } ta.remove(); }
    };

    // ---------- start ----------
    var start = Number((/^#(\d+)$/.exec(location.hash) || [])[1]) || 1;
    start = Math.max(1, Math.min(N, start));
    frame.addEventListener("load", function () { $("loading").classList.add("done"); });
    frame.src = deckUrl + "#" + start;
    setCur(start);
  })();
  </script>
</body>
</html>
