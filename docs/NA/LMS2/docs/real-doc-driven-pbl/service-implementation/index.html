<script id="auth-guard">
    (function() {
      function getCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for(var i=0; i < ca.length; i++) {
          var c = ca[i];
          while (c.charAt(0)==' ') c = c.substring(1,c.length);
          if (c.indexOf(nameEQ) == 0) return decodeURIComponent(c.substring(nameEQ.length,c.length));
        }
        return null;
      }
      
      var loggedInUser = getCookie('currentUser');
      
      if (!loggedInUser) {
        var sessionStr = localStorage.getItem('currentUserSession');
        if (sessionStr) {
          try {
            var session = JSON.parse(sessionStr);
            if (Date.now() < session.expiresAt) {
              loggedInUser = session.value;
            } else {
              localStorage.removeItem('currentUserSession');
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
      
      var isLoginPage = window.location.pathname.indexOf('login.html') !== -1;
      
      if (isLoginPage) {
        if (loggedInUser) {
          window.location.href = '../index.html';
        }
      } else {
        if (!loggedInUser) {
          var redirectPath = 'login/login.html';
          var m = window.location.pathname.match(/^(.*\/NA\/LMS2\/docs\/)/);
          if (m) {
            redirectPath = m[1] + 'login/login.html';
          } else {
            var idx = window.location.pathname.indexOf('LMS2/docs/');
            if (idx !== -1) {
              var sub = window.location.pathname.substring(idx + 'LMS2/docs/'.length);
              var depth = (sub.match(/\//g) || []).length;
              redirectPath = (depth > 0 ? '../'.repeat(depth) : '') + 'login/login.html';
            } else if (window.location.pathname.indexOf('/day') !== -1 || window.location.pathname.indexOf('/announcement') !== -1 || window.location.pathname.indexOf('/project_day') !== -1) {
              redirectPath = '../login/login.html';
            }
          }
          window.location.href = redirectPath;
        }
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>샌드위치·음료 주문 키오스크 서비스 | 통합 런처 & 실시간 연동 뷰</title>
  <style>
    :root {
      --bg: #F6F9F4;
      --surface: #FFFFFF;
      --primary: #27765B;
      --text: #243B35;
      --muted: #4A605A;
      --border: rgba(36,59,53,0.14);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .launcher-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
    }
    .brand-badge {
      background: rgba(39,118,91,0.198);
      color: #27765B;
      border: 1px solid rgba(39,118,91,0.4);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .mode-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #F6F9F4;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn[aria-pressed="true"],
    .btn.primary {
      background: #D7EEDD;
      color: #243B35;
      border-color: var(--primary);
      font-weight: 800;
    }
    .workspace {
      flex: 1;
      display: flex;
      gap: 14px;
      padding: 14px;
      min-height: 0;
    }
    .pane {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      min-height: 0;
    }
    .pane-customer {
      width: 420px;
      flex-shrink: 0;
    }
    .pane-admin {
      flex: 1;
      min-width: 0;
    }
    .pane-header {
      padding: 8px 14px;
      background: #F6F9F4;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }
    .pane-header a {
      color: #2B5CA6;
      text-decoration: none;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #FFFFFF;
    }
    @media (max-width: 1100px) {
      .workspace {
        flex-direction: column;
        overflow-y: auto;
      }
      .pane-customer {
        width: 100%;
        height: 760px;
      }
      .pane-admin {
        width: 100%;
        height: 860px;
      }
    }
  </style>
</head>
<body>
  <header class="launcher-header">
    <div class="brand">
      <span style="font-size:1.4rem;" aria-hidden="true">🥪</span>
      <h1>샌드위치·음료 주문 키오스크 서비스</h1>
      <span class="brand-badge">실시간 양방향 동기화 활성</span>
    </div>
    <nav class="mode-actions" aria-label="화면 보기 모드 전환">
      <button type="button" class="btn" id="mode-split-btn" aria-pressed="true">
        ⚡ 고객 모바일 + PC 관리자 동시 보기
      </button>
      <button type="button" class="btn" id="mode-customer-btn" aria-pressed="false">
        📱 고객 모바일 화면만 보기
      </button>
      <button type="button" class="btn" id="mode-admin-btn" aria-pressed="false">
        🖥️ PC 관리자 화면만 보기
      </button>
      <a href="customer/index.html" target="_blank" rel="noopener" class="btn">
        ↗ 고객 화면 새 창
      </a>
      <a href="admin/index.html" target="_blank" rel="noopener" class="btn">
        ↗ 관리자 화면 새 창
      </a>
    </nav>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane pane-customer" id="customer-pane" aria-label="고객 모바일 주문 화면 프리뷰">
      <div class="pane-header">
        <span>📱 고객 모바일 주문 서비스 (360px+ 세로 화면 기준)</span>
        <a href="customer/index.html" target="_blank" rel="noopener">단독 창 열기 ↗</a>
      </div>
      <iframe src="customer/index.html" title="고객 모바일 주문 서비스"></iframe>
    </section>

    <section class="pane pane-admin" id="admin-pane" aria-label="PC 관리자 화면 프리뷰">
      <div class="pane-header">
        <span>🖥️ PC 매장 관리자 센터 (주문·메뉴·품절·매출·설정·권한)</span>
        <a href="admin/index.html" target="_blank" rel="noopener">단독 창 열기 ↗</a>
      </div>
      <iframe src="admin/index.html" title="PC 관리자 화면"></iframe>
    </section>
  </main>

  <script>
    (function () {
      const splitBtn = document.getElementById('mode-split-btn');
      const custBtn = document.getElementById('mode-customer-btn');
      const adminBtn = document.getElementById('mode-admin-btn');
      const custPane = document.getElementById('customer-pane');
      const adminPane = document.getElementById('admin-pane');

      function setMode(mode) {
        splitBtn.setAttribute('aria-pressed', String(mode === 'SPLIT'));
        custBtn.setAttribute('aria-pressed', String(mode === 'CUSTOMER'));
        adminBtn.setAttribute('aria-pressed', String(mode === 'ADMIN'));

        if (mode === 'SPLIT') {
          custPane.style.display = 'flex';
          custPane.style.width = '420px';
          custPane.style.margin = '0';
          adminPane.style.display = 'flex';
        } else if (mode === 'CUSTOMER') {
          custPane.style.display = 'flex';
          custPane.style.width = '460px';
          custPane.style.margin = '0 auto';
          adminPane.style.display = 'none';
        } else if (mode === 'ADMIN') {
          custPane.style.display = 'none';
          adminPane.style.display = 'flex';
        }
      }

      splitBtn.addEventListener('click', () => setMode('SPLIT'));
      custBtn.addEventListener('click', () => setMode('CUSTOMER'));
      adminBtn.addEventListener('click', () => setMode('ADMIN'));
    })();
  </script>
</body>
</html>
