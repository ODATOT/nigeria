<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <!-- Top Blue Stripe -->
  <rect width="500" height="80" fill="#0099B5"/>
  <!-- Top Red Thin Stripe -->
  <rect y="80" width="500" height="5" fill="#CE1126"/>
  <!-- Middle White Stripe -->
  <rect y="85" width="500" height="80" fill="#FFFFFF"/>
  <!-- Bottom Red Thin Stripe -->
  <rect y="165" width="500" height="5" fill="#CE1126"/>
  <!-- Bottom Green Stripe -->
  <rect y="170" width="500" height="80" fill="#1EB53A"/>
  
  <!-- Crescent Moon -->
  <circle cx="70" cy="40" r="30" fill="#FFFFFF"/>
  <circle cx="78" cy="40" r="25" fill="#0099B5"/>
  
  <!-- 12 Stars (Def) -->
  <defs>
    <polygon id="star" points="0,-6 1.76,-1.85 6.18,-1.85 2.61,0.74 3.97,4.85 0,2.26 -3.97,4.85 -2.61,0.74 -6.18,-1.85 -1.76,-1.85" fill="#FFFFFF"/>
  </defs>
  
  <!-- Row 1: 3 stars -->
  <use href="#star" x="124" y="20"/>
  <use href="#star" x="144" y="20"/>
  <use href="#star" x="164" y="20"/>
  
  <!-- Row 2: 4 stars -->
  <use href="#star" x="104" y="40"/>
  <use href="#star" x="124" y="40"/>
  <use href="#star" x="144" y="40"/>
  <use href="#star" x="164" y="40"/>
  
  <!-- Row 3: 5 stars -->
  <use href="#star" x="84" y="60"/>
  <use href="#star" x="104" y="60"/>
  <use href="#star" x="124" y="60"/>
  <use href="#star" x="144" y="60"/>
  <use href="#star" x="164" y="60"/>
</svg>
